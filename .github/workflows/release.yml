name: Release launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Тег релиза, например v1.1.0'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s test

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "BeluvuLauncher" --icon "assets\icon.ico"
          --add-data "web;web" --add-data "agent;agent"
          --exclude-module tkinter --exclude-module unittest --exclude-module pydoc
          --collect-all webview --collect-all PyQt6 main.py

      - name: Checksum
        id: sum
        shell: pwsh
        run: |
          $f = "dist/BeluvuLauncher.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          $s = (Get-Item $f).Length
          "sha256=$h" >> $env:GITHUB_OUTPUT
          "size=$s" >> $env:GITHUB_OUTPUT
          "sha256: $h  size: $s" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BeluvuLauncher.exe
          tag_name: ${{ inputs.version || github.ref_name }}
          body: |
            sha256: ${{ steps.sum.outputs.sha256 }}
            size: ${{ steps.sum.outputs.size }}
