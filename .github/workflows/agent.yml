name: agent
on:
  push:
    paths: ["agent/**", ".github/workflows/agent.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build friends-agent.jar
        run: sh agent/build.sh
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: friends-agent
          path: agent/friends-agent.jar
      - name: Commit jar back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add agent/friends-agent.jar
          git diff --cached --quiet || (git commit -m "agent: rebuild friends-agent.jar [skip ci]" && git push)
